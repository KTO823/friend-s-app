<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友圈管理工具</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app-container">
    <header>
      <h1>三人朋友圈</h1>
    </header>

    <main>
      <div id="birthday-view" class="view">
        <h2>🎂 生日倒數</h2>
        <div id="birthday-list" class="card-list">
          <p style="text-align: center; color: #999;">正在載入資料...</p>
        </div>
      </div>

      <div id="gift-view" class="view" style="display: none;">🎁 禮物清單功能開發中...</div>
      <div id="debt-view" class="view" style="display: none;">💰 債務紀錄功能開發中...</div>
      
      <div id="settings-view" class="view" style="display: none;">
        <h2>⚙️ 個人設定</h2>
        
        <div id="login-section">
          <p>請先登入才能使用完整功能</p>
          <button id="login-btn" class="primary-btn">用 Google 登入</button>
        </div>

        <div id="profile-section" style="display: none;">
          <p>目前登入：<span id="user-email"></span></p>
          
          <div class="input-group">
            <label>自定義暱稱：</label>
            <input type="text" id="profile-name" placeholder="輸入你們之間的稱呼">
          </div>
          
          <div class="input-group">
            <label>專屬頭像 (Emoji/顏文字)：</label>
            <input type="text" id="profile-avatar" placeholder="例如：😎 或 ✧(・∀・)✧">
          </div>

          <div class="input-group">
            <label>我的生日：</label>
            <input type="date" id="profile-birthday">
          </div>

          <div class="input-group">
            <label>銀行帳號 1 (例如：台新 812-xxxx)：</label>
            <input type="text" id="profile-bank1" placeholder="填寫銀行代碼與帳號">
          </div>
          <div class="input-group">
            <label>銀行帳號 2 (例如：國泰 013-xxxx)：</label>
            <input type="text" id="profile-bank2" placeholder="備用銀行帳號">
          </div>
          <div class="input-group">
            <label>LINE Pay 轉帳連結：</label>
            <input type="text" id="profile-linepay" placeholder="貼上你的轉帳連結">
          </div>
          
          <button id="save-profile-btn" class="primary-btn">儲存設定</button>
          <button id="logout-btn" class="secondary-btn" style="margin-top: 20px;">登出</button>
        </div>
      </div>
    </main>

    <nav>
      <button onclick="switchTab('birthday')">生日</button>
      <button onclick="switchTab('gift')">禮物</button>
      <button onclick="switchTab('debt')">債務</button>
      <button onclick="switchTab('settings')">設定</button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 填入你專屬的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyCsG7ucrwAgoacvzMbxxeOV6-L9s_UxQLU",
      authDomain: "birthday-gifts-and-debt.firebaseapp.com",
      projectId: "birthday-gifts-and-debt",
      storageBucket: "birthday-gifts-and-debt.firebasestorage.app",
      messagingSenderId: "833409590607",
      appId: "1:833409590607:web:f31bacf2232c591b98d13a",
      measurementId: "G-XK9XD971LZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 登入與登出按鈕
    document.getElementById('login-btn').addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => alert("登入失敗：" + error.message));
    });
    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    // 儲存個人設定到 Firebase
    document.getElementById('save-profile-btn').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) return alert("請先登入！");

      const name = document.getElementById('profile-name').value;
      const avatar = document.getElementById('profile-avatar').value || "😎";
      const birthday = document.getElementById('profile-birthday').value;
      const bank1 = document.getElementById('profile-bank1').value;
      const bank2 = document.getElementById('profile-bank2').value;
      const linepay = document.getElementById('profile-linepay').value;

      if (!name || !birthday) return alert("名稱和生日一定要填喔！");

      try {
        await setDoc(doc(db, "users", user.uid), {
          name: name,
          avatar: avatar,
          birthday: birthday,
          bank1: bank1,
          bank2: bank2,
          linepay: linepay,
          email: user.email
        });
        alert("設定已成功儲存！");
        window.loadBirthdays(); // 存檔後順便更新生日畫面
      } catch (error) {
        alert("儲存失敗：" + error.message);
      }
    });

    // 從 Firebase 抓取所有人資料的函數
    window.loadBirthdays = async function() {
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        const usersData = [];
        querySnapshot.forEach((doc) => {
          usersData.push(doc.data());
        });
        window.renderBirthdaysFromData(usersData); // 呼叫 app.js 的渲染函數
      } catch (error) {
        console.error("載入生日失敗：", error);
      }
    };

    // 監聽登入狀態
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('profile-section').style.display = 'block';
        document.getElementById('user-email').textContent = user.email;
        
        // 登入後，自動把之前存過的設定填回輸入框
        const docSnap = await getDoc(doc(db, "users", user.uid));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('profile-name').value = data.name || "";
          document.getElementById('profile-avatar').value = data.avatar || "";
          document.getElementById('profile-birthday').value = data.birthday || "";
          document.getElementById('profile-bank1').value = data.bank1 || "";
          document.getElementById('profile-bank2').value = data.bank2 || "";
          document.getElementById('profile-linepay').value = data.linepay || "";
        }
        
        window.loadBirthdays(); // 登入後自動載入生日列表
      } else {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('profile-section').style.display = 'none';
      }
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
