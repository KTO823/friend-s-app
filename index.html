<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記得給money｜卡戳</title>
  <link rel="stylesheet" href="app.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <div id="app-container">
    <header>
      <h1>記得給money</h1>
    </header>

    <main>
      <div id="birthday-view" class="view">
        <h2>🎂 生日倒數</h2>
        <div id="birthday-list" class="card-list">
          <p style="text-align: center; color: #999;">正在載入資料...</p>
        </div>
      </div>

      <div id="gift-view" class="view" style="display: none;">
        <h2>🎁 許願池</h2>
        <p id="gift-login-hint" style="text-align: center; color: #999;">請先登入才能查看或新增許願</p>

        <div id="gift-list" class="card-list">
          </div>

        <button id="open-gift-modal-btn" class="fab-btn" style="display: none;">＋</button>
      </div>

      <div id="gift-modal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="gift-modal-title">新增許願商品</h3>
            <button id="close-gift-modal-btn" class="close-modal-btn">✕</button>
          </div>
          <div class="input-section" style="margin-bottom: 0; border: none; padding: 0;">
            <input type="text" id="gift-name" class="form-input" placeholder="商品名稱 (例：金髮毛衣男的壓克力立牌)">
            <input type="text" id="gift-link" class="form-input" placeholder="參考網址或圖片連結 (選填)">
            <input type="number" id="gift-price" class="form-input" placeholder="大約價格 (選填)">
            <input type="text" id="gift-note" class="form-input" placeholder="備註 (例：請幫我在駿河屋找找)">
            <button id="add-gift-btn" class="primary-btn">丟入許願池</button>
          </div>
        </div>
      </div>
      
      <div id="trip-view" class="view" style="display: none;">
        <h2>✈️ 行程與代購</h2>
        <p id="trip-login-hint" style="text-align: center; color: #999;">請先至「設定」登入後才能看見與發佈行程</p>

        <div id="trip-list" class="card-list">
          </div>

        <button id="open-trip-modal-btn" class="fab-btn" style="display: none;">＋</button>
      </div>

      <div id="trip-modal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header">
            <h3>發佈新行程</h3>
            <button id="close-trip-modal-btn" class="close-modal-btn">✕</button>
          </div>
          <div class="input-section" style="margin-bottom: 0; border: none; padding: 0;">
            <input type="text" id="trip-dest" class="form-input" placeholder="要去哪裡？ (例：秋葉原)">
            <input type="date" id="trip-date" class="form-input">
            <input type="text" id="trip-note" class="form-input" placeholder="代購備註 (例：匯率0.23)">
            <button id="add-trip-btn" class="primary-btn">發佈行程並寄信通知</button>
          </div>
        </div>
      </div>
      
      <div id="settings-view" class="view" style="display: none;">
        <h2>⚙️ 個人設定</h2>
        
        <div id="login-section">
          <p>請先登入才能使用完整功能</p>
          <button id="login-btn" class="primary-btn">用 Google 登入</button>
        </div>

        <div id="profile-section" style="display: none;">
          <p>目前登入：<span id="user-email"></span></p>
          
          <div class="input-group">
            <label>自定義暱稱：</label>
            <input type="text" id="profile-name" placeholder="輸入你們之間的稱呼">
          </div>
          
          <div class="input-group">
            <label>專屬頭像 (Emoji/顏文字)：</label>
            <input type="text" id="profile-avatar" placeholder="例如：😎 或 ✧(・∀・)✧">
          </div>

          <div class="input-group">
            <label>我的生日：</label>
            <input type="date" id="profile-birthday">
          </div>

          <div class="input-group">
            <label>收款方式：</label>
            <div id="payment-methods-container"></div>
            <button id="add-payment-btn" class="secondary-btn" style="margin-top: 10px;">＋ 新增收款方式</button>
          </div>
          
          <button id="save-profile-btn" class="primary-btn" style="margin-top: 20px;">儲存設定</button>
          <button id="logout-btn" class="secondary-btn" style="margin-top: 20px;">登出</button>
        </div>
      </div>
    </main>

    <nav>
      <button onclick="switchTab('birthday')">生日</button>
      <button onclick="switchTab('gift')">禮物</button>
      <button onclick="switchTab('trip')">行程代購</button>
      <button onclick="switchTab('settings')">設定</button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, getDoc, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // --- 在這裡填入你的 EmailJS 金鑰 ---
    emailjs.init("YOUR_PUBLIC_KEY"); 
    const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";
    // ------------------------------------

    const firebaseConfig = {
      apiKey: "AIzaSyCsG7ucrwAgoacvzMbxxeOV6-L9s_UxQLU",
      authDomain: "birthday-gifts-and-debt.firebaseapp.com",
      projectId: "birthday-gifts-and-debt",
      storageBucket: "birthday-gifts-and-debt.firebasestorage.app",
      messagingSenderId: "833409590607",
      appId: "1:833409590607:web:f31bacf2232c591b98d13a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    // 控制彈出視窗的開關
    const modal = document.getElementById('trip-modal');
    document.getElementById('open-trip-modal-btn').addEventListener('click', () => modal.classList.add('active'));
    document.getElementById('close-trip-modal-btn').addEventListener('click', () => modal.classList.remove('active'));

    window.addPaymentRow = function(type = '銀行帳號', code = '', value = '') {
      const container = document.getElementById('payment-methods-container');
      const row = document.createElement('div');
      row.className = 'payment-row';
      row.innerHTML = `
        <select class="pay-type" onchange="
          const isBank = this.value === '銀行帳號';
          this.nextElementSibling.style.display = isBank ? 'block' : 'none';
          this.nextElementSibling.nextElementSibling.placeholder = isBank ? '請輸入帳號' : '貼上轉帳連結';
        ">
          <option value="銀行帳號" ${type === '銀行帳號' ? 'selected' : ''}>銀行帳號</option>
          <option value="LINE Pay" ${type === 'LINE Pay' ? 'selected' : ''}>LINE Pay</option>
        </select>
        <input type="text" class="bank-code" value="${code}" placeholder="代號" style="width: 70px; display: ${type === '銀行帳號' ? 'block' : 'none'};">
        <input type="text" class="pay-value" value="${value}" placeholder="${type === '銀行帳號' ? '請輸入帳號' : '貼上轉帳連結'}" style="flex: 1;">
        <button class="delete-btn" onclick="this.parentElement.remove()">刪除</button>
      `;
      container.appendChild(row);
    };
    document.getElementById('add-payment-btn').addEventListener('click', () => window.addPaymentRow());

    document.getElementById('save-profile-btn').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) return alert("請先登入！");
      const name = document.getElementById('profile-name').value;
      const avatar = document.getElementById('profile-avatar').value || "😎";
      const birthday = document.getElementById('profile-birthday').value;

      const payments = [];
      document.querySelectorAll('.payment-row').forEach(row => {
        const type = row.querySelector('.pay-type').value;
        const code = row.querySelector('.bank-code').value;
        const value = row.querySelector('.pay-value').value;
        if (value.trim() !== '') payments.push({ type, code, value });
      });

      if (!name || !birthday) return alert("名稱和生日一定要填喔！");
      document.getElementById('save-profile-btn').textContent = "儲存中...";
      
      try {
        await setDoc(doc(db, "users", user.uid), { name, avatar, birthday, payments, email: user.email });
        alert("設定已成功儲存！");
        if (window.loadBirthdays) window.loadBirthdays();
      } catch (error) {
        alert("儲存失敗：" + error.message);
      } finally {
        document.getElementById('save-profile-btn').textContent = "儲存設定";
      }
    });

    window.loadBirthdays = async function() {
      const q = await getDocs(collection(db, "users"));
      const usersData = [];
      q.forEach(doc => usersData.push(doc.data()));
      if (window.renderBirthdaysFromData) window.renderBirthdaysFromData(usersData);
    };

    // 儲存禮物許願
    document.getElementById('add-gift-btn')?.addEventListener('click', async () => {
      const user = auth.currentUser;
      const itemName = document.getElementById('gift-name').value;
      const itemLink = document.getElementById('gift-link').value;
      const itemPrice = document.getElementById('gift-price').value;
      const itemNote = document.getElementById('gift-note').value;

      if (!itemName) return alert("至少要填寫商品名稱喔！");
      
      const btn = document.getElementById('add-gift-btn');
      btn.textContent = "丟入中...";
      btn.disabled = true;

      try {
        const myDoc = await getDoc(doc(db, "users", user.uid));
        const myName = myDoc.exists() ? myDoc.data().name : "朋友";
        const myAvatar = myDoc.exists() ? myDoc.data().avatar : "😎";

        await addDoc(collection(db, "gifts"), {
          uid: user.uid,
          name: myName,
          avatar: myAvatar,
          itemName: itemName,
          link: itemLink,
          price: itemPrice,
          note: itemNote,
          createdAt: new Date()
        });

        alert("已成功丟入許願池！");
        document.getElementById('gift-name').value = '';
        document.getElementById('gift-link').value = '';
        document.getElementById('gift-price').value = '';
        document.getElementById('gift-note').value = '';
        document.getElementById('gift-modal').classList.remove('active');
      } catch (error) {
        alert("新增失敗：" + error.message);
      } finally {
        btn.textContent = "丟入許願池";
        btn.disabled = false;
      }
    });

    // 即時監聽禮物清單
    onSnapshot(query(collection(db, "gifts"), orderBy("createdAt", "desc")), (snapshot) => {
      const gifts = [];
      snapshot.forEach(doc => gifts.push(doc.data()));
      if (window.renderGifts) window.renderGifts(gifts);
    });

    document.getElementById('add-trip-btn').addEventListener('click', async () => {
      const user = auth.currentUser;
      const dest = document.getElementById('trip-dest').value;
      const date = document.getElementById('trip-date').value;
      const note = document.getElementById('trip-note').value;

      if (!dest || !date) return alert("地點和日期一定要填！");
      
      const btn = document.getElementById('add-trip-btn');
      btn.textContent = "發佈中...";
      btn.disabled = true;

      try {
        const myDoc = await getDoc(doc(db, "users", user.uid));
        const myName = myDoc.exists() ? myDoc.data().name : "朋友";
        const myAvatar = myDoc.exists() ? myDoc.data().avatar : "😎";

        await addDoc(collection(db, "trips"), {
          uid: user.uid,
          name: myName,
          avatar: myAvatar,
          destination: dest,
          date: date,
          note: note,
          createdAt: new Date()
        });

        const usersSnap = await getDocs(collection(db, "users"));
        usersSnap.forEach(u => {
          const friendEmail = u.data().email;
          if (friendEmail && friendEmail !== user.email) {
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
              sender_name: myName,
              destination: dest,
              to_email: friendEmail
            }).catch(err => console.error("寄信失敗", err));
          }
        });

        alert("行程已發佈！");
        document.getElementById('trip-dest').value = '';
        document.getElementById('trip-date').value = '';
        document.getElementById('trip-note').value = '';
        
        // 發佈成功後自動關閉視窗
        modal.classList.remove('active');
      } catch (error) {
        alert("發佈失敗：" + error.message);
      } finally {
        btn.textContent = "發佈行程並寄信通知";
        btn.disabled = false;
      }
    });

    onSnapshot(query(collection(db, "trips"), orderBy("createdAt", "desc")), (snapshot) => {
      const trips = [];
      snapshot.forEach(doc => trips.push(doc.data()));
      if (window.renderTrips) window.renderTrips(trips);
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('profile-section').style.display = 'block';
        document.getElementById('open-trip-modal-btn').style.display = 'flex';
        document.getElementById('trip-login-hint').style.display = 'none';
        document.getElementById('user-email').textContent = user.email;
        
        const docSnap = await getDoc(doc(db, "users", user.uid));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('profile-name').value = data.name || "";
          document.getElementById('profile-avatar').value = data.avatar || "";
          document.getElementById('profile-birthday').value = data.birthday || "";
          document.getElementById('payment-methods-container').innerHTML = '';
          document.getElementById('open-gift-modal-btn').style.display = 'flex';
          document.getElementById('gift-login-hint').style.display = 'none';
          if (data.payments) data.payments.forEach(p => window.addPaymentRow(p.type, p.code || '', p.value));
        }
        window.loadBirthdays();
      } else {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('profile-section').style.display = 'none';
        document.getElementById('open-trip-modal-btn').style.display = 'none';
        document.getElementById('trip-login-hint').style.display = 'block';
        document.getElementById('open-gift-modal-btn').style.display = 'none';
        document.getElementById('gift-login-hint').style.display = 'block';
      }
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
